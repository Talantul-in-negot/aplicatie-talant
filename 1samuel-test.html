<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Talantul în negoț</title>
  <script>
    const target = new URL('./', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</head>
<body>
  <p>Se deschide aplicația… <a id="continueLink" href="./">Continuă</a></p>
  <script>document.getElementById('continueLink').href = new URL('./' + location.search + location.hash, location.href).href;</script>
</body>
</html>
