name: Quality and live verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    # Aplică toate migrările pe o bază curată și verifică garanțiile de scorare
    # înainte ca workflow-ul de migrări să atingă producția.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d talant"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TALANT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/talant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db

  verify-live:
    if: github.event_name == 'push'
    needs: [validate, database]
    runs-on: ubuntu-latest
    env:
      TALANT_BASE_URL: https://talantul-in-negot.github.io/aplicatie-talant/
      TALANT_E2E_EMAIL: ${{ secrets.TALANT_E2E_EMAIL }}
      TALANT_E2E_PASSWORD: ${{ secrets.TALANT_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for GitHub Pages to publish this revision
        shell: bash
        run: |
          for attempt in {1..30}; do
            page="$(curl -fsSL "${TALANT_BASE_URL}?revision=${GITHUB_SHA}" || true)"
            if grep -q "samuel1-3-v2" <<<"$page" && grep -q "p_answers: submittedAnswers" <<<"$page"; then
              echo "GitHub Pages serves the secure v2 application."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not publish the expected revision within five minutes."
          exit 1
      - name: Verify authentication, scoring RPC, and leaderboard
        if: env.TALANT_E2E_EMAIL != '' && env.TALANT_E2E_PASSWORD != ''
        run: npm run test:e2e
      - name: Require configured E2E credentials
        if: env.TALANT_E2E_EMAIL == '' || env.TALANT_E2E_PASSWORD == ''
        run: |
          echo "Configure TALANT_E2E_EMAIL and TALANT_E2E_PASSWORD repository secrets."
          exit 1
